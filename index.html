<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>What Does It Mean to Solve a System?</title>
<style>
:root{--bg:#f7f7f4;--panel:#fff;--text:#1f2937;--muted:#6b7280;--border:#d9ddd7;--accent:#315f50;--good:#23663f;--bad:#9b3b3b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}.app{max-width:980px;margin:auto;padding:24px 16px 40px}.top,.nav{display:flex;justify-content:space-between;gap:12px}.top{align-items:flex-start;margin-bottom:18px}.nav{margin-top:18px;padding-top:18px;border-top:1px solid var(--border)}.eyebrow,.muted{color:var(--muted)}.eyebrow{font-size:14px;font-weight:700}.progress{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}.dot{width:30px;height:8px;border-radius:99px;background:var(--border)}.dot.active{background:var(--accent)}h2{font-size:30px;margin:0 0 10px}.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:20px}.equations{text-align:center;padding:22px;background:#fbfbf8;border:1px solid var(--border);border-radius:16px;margin:18px 0}.eq{font:28px "Courier New",monospace;margin:8px}.choices{display:grid;gap:10px;margin-top:14px}button{font:inherit;cursor:pointer}.choice,.btn,.secondary{border-radius:12px;min-height:46px;padding:12px 15px}.choice{text-align:left;border:1px solid var(--border);background:#fff}.choice.selected{outline:3px solid #b8cbc3;border-color:var(--accent)}.btn{border:0;background:var(--accent);color:#fff;font-weight:700}.secondary{border:1px solid var(--border);background:#fff}button:disabled{opacity:.45;cursor:not-allowed}.feedback{margin-top:16px;border:1px solid var(--border);background:#fbfbf8;border-radius:14px;padding:14px 16px;line-height:1.45}.good{color:var(--good)}.bad{color:var(--bad)}.grid2,.grid3{display:grid;gap:14px}.grid2{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:repeat(3,1fr)}.graph-wrap{overflow-x:auto;margin-top:14px}svg{display:block;width:100%;max-width:580px;margin:auto;background:#fff;border:1px solid var(--border);border-radius:14px}.slider-layout{display:grid;grid-template-columns:240px 1fr;gap:20px}.inputs{display:flex;gap:16px;flex-wrap:wrap}.num{width:92px;padding:11px;border:1px solid var(--border);border-radius:10px;font-size:18px}.center{text-align:center}.big{font-size:32px;font-weight:800}.tag{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em}.mini{font:18px/1.65 "Courier New",monospace}.solution{font-size:22px;font-weight:800;text-align:center;margin-top:10px}input[type=range]{width:100%}@media(max-width:700px){h2{font-size:25px}.grid2,.grid3,.slider-layout{grid-template-columns:1fr}.eq{font-size:23px}}
</style></head>
<body><main class="app"><div class="top"><div><div id="label" class="eyebrow"></div><div id="progress" class="progress"></div></div><button id="restart" class="secondary">Restart</button></div><section id="stage" class="card" aria-live="polite"></section><div class="nav"><button id="back" class="secondary">← Back</button><button id="next" class="btn">Continue →</button></div></main>
<script>
(()=>{const S=document.getElementById('stage'),N=document.getElementById('next'),B=document.getElementById('back'),L=document.getElementById('label'),P=document.getElementById('progress');let s=0;const u=Array(9).fill(false),names=['Predict','Test','Investigate','Visualize','Explore','Connect','Solve','Challenge','Reflect'];const eq=t=>'<div class="eq">'+t+'</div>',fb=(t,c='')=>'<div class="feedback '+c+'">'+t+'</div>',ch=(t,v)=>'<button class="choice" data-v="'+v+'">'+t+'</button>';
function graph(xi=2,yi=3,b=5){const W=520,H=340,p=38,z=34,X=x=>p+(x+4)*z,Y=y=>H-p-(y+2)*z;let g='';for(let x=-4;x<=8;x++)g+='<line x1="'+X(x)+'" y1="'+p+'" x2="'+X(x)+'" y2="'+(H-p)+'" stroke="#eceeea"/>';for(let y=-2;y<=7;y++)g+='<line x1="'+p+'" y1="'+Y(y)+'" x2="'+(W-p)+'" y2="'+Y(y)+'" stroke="#eceeea"/>';const pts=(m,c)=>X(-4)+','+Y(m*-4+c)+' '+X(8)+','+Y(m*8+c);return '<div class="graph-wrap"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Graph of two linear equations"><g>'+g+'</g><line x1="'+X(-4)+'" y1="'+Y(0)+'" x2="'+X(8)+'" y2="'+Y(0)+'" stroke="#374151"/><line x1="'+X(0)+'" y1="'+Y(-2)+'" x2="'+X(0)+'" y2="'+Y(7)+'" stroke="#374151"/><polyline points="'+pts(1,1)+'" fill="none" stroke="#4f6f8f" stroke-width="4"/><polyline points="'+pts(-1,b)+'" fill="none" stroke="#9a6b52" stroke-width="4"/><circle cx="'+X(xi)+'" cy="'+Y(yi)+'" r="7" fill="#1f2937"/><text x="'+(X(xi)+10)+'" y="'+(Y(yi)-10)+'" font-size="14" font-weight="700">('+xi+', '+yi+')</text></svg></div>'}
function screen(){if(s===0)return '<div class="tag">PREDICT</div><h2>What does it mean to solve a system?</h2><div class="equations">'+eq('y = x + 1')+eq('y = −x + 5')+'</div><p><b>For a point to be a solution to the system, what must be true?</b></p><div class="choices">'+ch('It works in the first equation.','one')+ch('It works in at least one equation.','either')+ch('It works in BOTH equations.','both')+'</div><div id="fb"></div>';
if(s===1)return '<div class="tag">TEST</div><h2>Could (1, 2) be the solution?</h2><p class="muted">Test the point instead of guessing.</p><div class="grid2"><div class="card"><b>Equation 1</b>'+eq('y = x + 1')+'<button class="btn" id="t1">Test Equation 1</button><div id="r1"></div></div><div class="card"><b>Equation 2</b>'+eq('y = −x + 5')+'<button class="btn" id="t2" disabled>Test Equation 2</button><div id="r2"></div></div></div><div id="fb"></div>';
if(s===2)return '<div class="tag">INVESTIGATE</div><h2>Which point works in BOTH equations?</h2><div class="equations">'+eq('y = x + 1')+eq('y = −x + 5')+'</div><div class="grid3">'+ch('(1, 2)','1,2')+ch('(2, 3)','2,3')+ch('(3, 4)','3,4')+'</div><div id="fb"></div>';
if(s===3)return '<div class="tag">VISUALIZE</div><h2>Where does the solution appear on the graph?</h2><p>You discovered that <b>(2,3)</b> works in both equations.</p>'+graph()+'<div class="center" style="margin-top:14px"><button class="btn" id="reveal">Reveal the connection</button></div><div id="fb"></div>';
if(s===4)return '<div class="tag">EXPLORE</div><h2>Change the equation. Watch the solution.</h2><div class="slider-layout"><div><div class="equations" style="text-align:left;margin-top:0">'+eq('y = x + 1')+'<div class="eq">y = −x + <span id="bv">5</span></div></div><label><b>Change b</b></label><input id="slider" type="range" min="2" max="8" value="5"><p class="muted">Move the slider and observe the intersection.</p></div><div id="lg">'+graph()+'</div></div><div id="sol" class="solution">Current solution: (2, 3)</div>';
if(s===5)return '<div class="tag">CONNECT</div><h2>Same mathematics. Different representations.</h2><div class="grid3"><div class="equations" style="margin:0"><b>Equations</b>'+eq('y = x + 1')+eq('y = −x + 5')+'</div><div class="center"><div class="muted">SOLUTION</div><div class="big">(2,3)</div></div><div class="equations" style="margin:0"><b>Check</b><div class="mini">3 = 2 + 1 ✓</div><div class="mini">3 = −2 + 5 ✓</div></div></div><p><b>Why is (2,3) the solution?</b></p><div class="choices">'+ch('It is on one line.','one')+ch('It makes BOTH equations true.','both')+ch('It has two coordinates.','coords')+'</div><div id="fb"></div>';
if(s===6)return '<div class="tag">SOLVE</div><h2>Can we find the intersection without the graph?</h2><div class="equations">'+eq('y = x + 2')+eq('y = −x + 6')+'</div><p><b>Both expressions equal y. What can we conclude?</b></p><div class="choices">'+ch('x + 2 = −x + 6','correct')+ch('x + 2 = x + 6','wrong')+ch('2 = 6','wrong2')+'</div><div id="fb"></div>';
if(s===7)return '<div class="tag">YOUR TURN</div><h2>Now solve one yourself.</h2><div class="equations">'+eq('y = x + 3')+eq('y = −x + 7')+'</div><div class="inputs"><label><b>x =</b> <input id="xi" class="num" type="number"></label><label><b>y =</b> <input id="yi" class="num" type="number"></label></div><div style="display:flex;gap:10px;margin-top:16px"><button id="check" class="btn">Check My Solution</button><button id="hint" class="secondary">Give me a hint</button></div><div id="fb"></div>';
return '<div class="tag center">REFLECT</div><h2 class="center">What did you discover?</h2><div class="equations"><p>The solution to a system is a point that makes</p><div class="big">BOTH equations true.</div><p>On a graph, that point is the</p><div class="big">INTERSECTION.</div></div><div class="center"><h3>✓ Lesson complete</h3><p class="muted">You connected equations, ordered pairs, graphs, and algebraic solving.</p></div>'}
function out(x){const f=document.getElementById('fb');if(f)f.innerHTML=x}function unlock(){u[s]=true;N.disabled=false}
function render(){S.innerHTML=screen();L.textContent=names[s]+' • '+(s+1)+' of 9';P.innerHTML=names.map((_,i)=>'<span class="dot '+(i<=s?'active':'')+'"></span>').join('');B.disabled=s===0;N.disabled=!u[s]&&s!==8;N.textContent=s===8?'Restart Lesson':'Continue →';wire()}
function wire(){document.querySelectorAll('.choice').forEach(q=>q.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));q.classList.add('selected');const v=q.dataset.v;if(s===0){out(fb(v==='both'?'<b>Good prediction.</b> Now let’s test whether “BOTH” really matters.':'Interesting prediction. Let’s test it instead of simply marking it wrong.',v==='both'?'good':''));unlock()}if(s===2){if(v==='2,3'){out(fb('<b>(2,3)</b>: Equation 1 ✓ &nbsp; Equation 2 ✓<br>It works in <b>BOTH</b>.','good'));unlock()}else out(fb('That point works in one equation, but not both. Try another point.','bad'))}if(s===5){if(v==='both'){out(fb('<b>Exactly.</b> (2,3) is shared by both equations. On the graph, that shared point is the intersection.','good'));unlock()}else out(fb('Look again: a system asks for a point shared by <b>BOTH</b> equations.','bad'))}if(s===6){if(v==='correct'){out(fb('<b>Exactly.</b><br><span class="mini">x + 2 = −x + 6<br>2x = 4<br>x = 2<br>y = 4</span><br>So the solution is <b>(2,4)</b>.','good')+graph(2,4,6));unlock()}else out(fb('If both expressions equal <b>y</b>, then those expressions must equal each other.','bad'))}});
if(s===1){t1.onclick=()=>{r1.innerHTML=fb('2 = 1 + 1<br><b>2 = 2 ✓ TRUE</b>','good');t1.disabled=true;t2.disabled=false};t2.onclick=()=>{r2.innerHTML=fb('2 = −(1) + 5<br><b>2 ≠ 4 ✗ NOT TRUE</b>','bad');out(fb('<b>(1,2)</b> works in Equation 1, but not Equation 2. A solution must make <b>BOTH equations true.</b>'));t2.disabled=true;unlock()}}
if(s===3)reveal.onclick=()=>{out(fb('Both lines pass through <b>(2,3)</b>. The point that makes BOTH equations true is where the graphs <b>INTERSECT</b>.','good'));unlock()};
if(s===4)slider.oninput=()=>{const b=+slider.value,x=(b-1)/2,y=x+1;bv.textContent=b;lg.innerHTML=graph(x,y,b);sol.textContent='Current solution: ('+x+', '+y+')';unlock()};
if(s===7){check.onclick=()=>{if(xi.value===''||yi.value===''){out(fb('Enter both an x-value and a y-value before checking.'));return}const x=+xi.value,y=+yi.value;if(x===2&&y===5){out(fb('<b>Correct!</b> (2,5) works in BOTH equations:<br><span class="mini">5 = 2 + 3 ✓<br>5 = −2 + 7 ✓</span>','good')+graph(2,5,7));unlock()}else out(fb('Not yet. Substitute your point into both original equations. It must make both true.','bad'))};hint.onclick=()=>out(fb('Hint: because both expressions equal <b>y</b>, start with <span class="mini">x + 3 = −x + 7</span>.'))}}
N.onclick=()=>{if(s===8){s=0;u.fill(false)}else if(!N.disabled)s++;render()};B.onclick=()=>{if(s>0)s--;render()};restart.onclick=()=>{s=0;u.fill(false);render()};render()})();
</script></body></html>
